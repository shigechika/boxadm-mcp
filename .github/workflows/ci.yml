name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        # No Windows smoke job here (unlike sibling MCP servers): boxadm-mcp's
        # OAuth token-cache locking imports fcntl at module load, which does not
        # exist on Windows -- a Windows job would fail on import, not exercise
        # anything real.
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev --python ${{ matrix.python-version }}
      - run: uv run pytest -v

  # Version-free required status check for the branch ruleset. The matrix
  # legs above are named after their Python version, so binding the ruleset
  # to them meant editing it on every Python bump; bind it to this job instead.
  # `needs.test.result` is "success" only when every matrix leg succeeded.
  test-ok:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - if: needs.test.result != 'success'
        run: exit 1
